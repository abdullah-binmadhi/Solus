name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: build-${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64
            artifact_name: solus-macos-aarch64
            binary_name: solus
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
            artifact_name: solus-macos-x86_64
            binary_name: solus
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            artifact_name: solus-linux-x86_64
            binary_name: solus
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            artifact_name: solus-windows-x86_64.exe
            binary_name: solus.exe

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: prepare artifact
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.artifact_name }}
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            chmod +x ${{ matrix.artifact_name }}
          fi
          # Also generate legacy ani-tui-* alias for backward compatibility:
          legacy_name=$(echo "${{ matrix.artifact_name }}" | sed 's/^solus-/ani-tui-/')
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} "$legacy_name"
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            chmod +x "$legacy_name"
          fi

      - name: upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ani-tui-*
          retention-days: 1

  release:
    name: create-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true
