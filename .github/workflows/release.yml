name: release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: build-${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64
            artifact_name: solus-macos-aarch64
            binary_name: solus
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
            artifact_name: solus-macos-x86_64
            binary_name: solus
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            artifact_name: solus-linux-x86_64
            binary_name: solus
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            artifact_name: solus-windows-x86_64.exe
            binary_name: solus.exe

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: prepare artifact
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.artifact_name }}
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            chmod +x ${{ matrix.artifact_name }}
          fi
          # Also generate legacy ani-tui-* alias for backward compatibility:
          legacy_name=$(echo "${{ matrix.artifact_name }}" | sed 's/^solus-/ani-tui-/')
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} "$legacy_name"
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            chmod +x "$legacy_name"
          fi

      - name: upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ani-tui-*
          retention-days: 1

  release:
    name: create-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: prepare release metadata
        id: meta
        shell: bash
        run: |
          commit_ts=$(git show -s --format=%ct "${{ github.sha }}" || echo "0")
          short_sha="${GITHUB_SHA::7}"
          pkg_ver=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          commit_msg=$(git log -1 --pretty=%s "${{ github.sha }}" || echo "Latest main build")

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_tag="${GITHUB_REF_NAME}"
            release_name="Solus ${release_tag}"
          else
            release_tag="v${pkg_ver}-rolling"
            release_name="Solus v${pkg_ver} (${short_sha})"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f "$release_tag" "${{ github.sha }}"
            git push -f origin "refs/tags/$release_tag"
          fi

          {
            echo "tag=$release_tag"
            echo "name=$release_name"
            echo "commit_ts=$commit_ts"
            echo "short_sha=$short_sha"
            echo "commit_msg=$commit_msg"
          } >> "$GITHUB_OUTPUT"

      - name: generate sha256 checksums
        shell: bash
        run: |
          (cd artifacts && sha256sum solus-* ani-tui-* > SHA256SUMS.txt)

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: |
            <!-- solus-sha:${{ github.sha }} -->
            <!-- solus-ts:${{ steps.meta.outputs.commit_ts }} -->
            <!-- solus-notes-start -->
            - [NEW] 4-Stage Video Mastering & Unified Player Engines: Solus now powers mpv, mpv.net, and Celluloid with unified 4:4:4 chroma upscaling, Anime4K era restoration, debanding, and smooth motion interpolation. How to use: Open Settings ('s') or press 'a' (Shaders), 'd' (Deband), 'm' (Motion), and 'g' (Performance) during playback.
            - [NEW] Multi-Provider Stream Discovery & Clean/Hardsub Indicators: Automatically probes verified providers (ZokoAnime, MegaPlay Direct/Hardsub, Vidmoly, AnimeHeaven, AnimeGG, and HiAnime) with Clean [CLN] vs Hardsub [EN] tags and demuxed audio tracks. How to use: Press 'Enter' on an episode to pick a server and subtitle track cleanly (hardsubbed videos use their embedded subtitles only).
            - [NEW] Voice-Synced Subtitles (Audio Alignment + VAD): Automatically aligns external subtitles to dialogue using reference timing and voice-activity matching, and remembers clean provider offsets per anime. How to use: Press 'y' in the player to snap subtitles to speech immediately, or open the HUD ('i' / 'S') for manual delay steps.
            - [IMPROVED] Interactive Player HUD Controls: Skip Intro, Skip Outro, and Next Episode buttons live neatly inside the Solus HUD right under the SubSync bar for on-demand control without intrusive popups. How to use: Press 'i' or 'Shift+I' in the player to toggle or pin the HUD, or press 'Tab' to skip intro/outro and 'n' / 'N' for Next Episode.
            - [FIXED] Crisper Loading Screen & Thumbnail Persistence: Locked the launch loading bar alignment cleanly inside the Y2K card and fixed episode thumbnails disappearing after playback or overlays. How to use: Launch any episode with 'Enter'; your episode artwork stays intact when returning to menus.
            <!-- solus-notes-end -->
            Automated build for commit `${{ steps.meta.outputs.short_sha }}`: ${{ steps.meta.outputs.commit_msg }}
          files: artifacts/*
          draft: false
          make_latest: true
          generate_release_notes: true
